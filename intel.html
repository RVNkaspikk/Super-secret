<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CS2Skins</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    background:#080a0f;
    color:#fff;
    font-family:Arial,sans-serif;
}

header{
    height:70px;
    background:#10131a;
    border-bottom:1px solid #252a33;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 6%;
    position:sticky;
    top:0;
    z-index:20;
}

.logo{
    font-size:25px;
    font-weight:900;
}

.logo span{color:#ff8700}

.balance{
    background:#181d25;
    padding:10px 16px;
    border-radius:8px;
    color:#ffad45;
    font-weight:bold;
}

.hero{
    text-align:center;
    padding:75px 20px 45px;
    background:
    radial-gradient(circle,#402000 0%,transparent 45%);
}

.hero h1{
    font-size:60px;
    margin-bottom:15px;
}

.hero h1 span{color:#ff8700}

.hero p{
    color:#8b929e;
}

.container{
    width:90%;
    max-width:1200px;
    margin:35px auto;
}

.title{
    font-size:25px;
    margin-bottom:20px;
}

.cases{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.case{
    background:#11151d;
    border:1px solid #272d38;
    border-radius:14px;
    padding:22px;
    text-align:center;
    transition:.2s;
}

.case:hover{
    transform:translateY(-5px);
    border-color:#ff8700;
}

.case-icon{
    font-size:85px;
    height:140px;
    display:flex;
    justify-content:center;
    align-items:center;
}

.case h3{
    margin-bottom:8px;
}

.case p{
    color:#737b87;
    font-size:13px;
    margin-bottom:15px;
}

.price{
    color:#ffad45;
    font-weight:bold;
    margin-bottom:12px;
}

button{
    width:100%;
    border:0;
    border-radius:8px;
    padding:13px;
    background:linear-gradient(135deg,#ff9700,#e65b00);
    color:white;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    filter:brightness(1.15);
}

.inventory{
    margin-top:65px;
}

.inventory-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
    gap:15px;
}

.item{
    background:#11151d;
    border:1px solid #292f39;
    border-radius:10px;
    padding:20px;
    text-align:center;
}

.item-icon{
    font-size:55px;
    margin-bottom:10px;
}

.item small{
    color:#727986;
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.85);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:100;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(750px,92%);
    background:#11151d;
    border:1px solid #303744;
    border-radius:18px;
    padding:25px;
    text-align:center;
}

.roulette{
    display:flex;
    gap:12px;
    overflow:hidden;
    background:#080a0f;
    padding:20px;
    margin:25px 0;
    border-radius:10px;
}

.roll-item{
    min-width:120px;
    height:100px;
    background:#191e27;
    border:1px solid #303743;
    border-radius:8px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    font-size:40px;
}

.roll-item span{
    font-size:11px;
    color:#aaa;
    margin-top:5px;
}

.close{
    background:#292f38;
    margin-top:15px;
}

footer{
    margin-top:80px;
    padding:30px;
    text-align:center;
    color:#555c68;
}

@media(max-width:600px){
    .hero h1{font-size:43px}
    header{padding:0 20px}
}
</style>
</head>

<body>

<header>

<div class="logo">
CS2<span>Skins</span>
</div>

<div class="balance">
💰 <span id="balance">100</span> Kč
</div>

</header>

<section class="hero">

<h1>CS2<span>Skins</span></h1>

<p>
Otevři case a rozšiř svou virtuální kolekci.
</p>

</section>

<main class="container">

<h2 class="title">🔥 Case Shop</h2>

<div class="cases">

<div class="case">
<div class="case-icon">📦</div>
<h3>Starter Case</h3>
<p>Základní kolekce</p>
<div class="price">25 Kč</div>
<button onclick="openCase(25,'Starter Case')">
OTEVŘÍT
</button>
</div>

<div class="case">
<div class="case-icon">🟠</div>
<h3>Inferno Case</h3>
<p>Žhavá kolekce</p>
<div class="price">50 Kč</div>
<button onclick="openCase(50,'Inferno Case')">
OTEVŘÍT
</button>
</div>

<div class="case">
<div class="case-icon">💎</div>
<h3>Diamond Case</h3>
<p>Prémiová kolekce</p>
<div class="price">100 Kč</div>
<button onclick="openCase(100,'Diamond Case')">
OTEVŘÍT
</button>
</div>

<div class="case">
<div class="case-icon">👑</div>
<h3>Legendary Case</h3>
<p>Legendární kolekce</p>
<div class="price">200 Kč</div>
<button onclick="openCase(200,'Legendary Case')">
OTEVŘÍT
</button>
</div>

</div>

<section class="inventory">

<h2 class="title">🎒 Inventář</h2>

<div id="inventory" class="inventory-grid"></div>

</section>

</main>

<div id="modal" class="modal">

<div class="modal-box">

<h2 id="modalTitle">
Otevírání...
</h2>

<div id="roulette" class="roulette"></div>

<h2 id="result"></h2>

<button class="close" onclick="closeModal()">
ZAVŘÍT
</button>

</div>

</div>

<footer>
CS2Skins © 2026
</footer>

<script>

let balance =
Number(localStorage.getItem("balance")) || 100;

let inventory =
JSON.parse(localStorage.getItem("inventory") || "[]");

const skins = [

["🔫","AK-47 | Neon"],
["🔪","Knife | Shadow"],
["🟣","AWP | Pulse"],
["🔵","M4A1-S | Ice"],
["🟡","Deagle | Gold"],
["🔴","USP-S | Fire"],
["🟢","Glock | Emerald"]

];

function update(){

document.getElementById("balance")
.innerText=balance;

localStorage.setItem(
"balance",
balance
);

renderInventory();

}

function renderInventory(){

const box =
document.getElementById("inventory");

box.innerHTML="";

if(inventory.length===0){

box.innerHTML=`
<div class="item">
<div class="item-icon">🎒</div>
<strong>Inventář je prázdný</strong>
<br>
<small>Otevři svůj první case.</small>
</div>`;

return;

}

inventory.forEach(item=>{

box.innerHTML+=`

<div class="item">

<div class="item-icon">
${item.icon}
</div>

<strong>
${item.name}
</strong>

<br>

<small>
Virtuální item
</small>

</div>

`;

});

}

function openCase(price,name){

if(balance < price){

alert("Nemáš dostatek kreditů.");

return;

}

balance-=price;

update();

document
.getElementById("modal")
.classList.add("show");

document
.getElementById("modalTitle")
.innerText=
name+" — otevírání";

document
.getElementById("result")
.innerText="";

const roulette =
document.getElementById("roulette");

roulette.innerHTML="";

for(let i=0;i<15;i++){

const skin =
skins[
Math.floor(
Math.random()*skins.length
)
];

roulette.innerHTML+=`

<div class="roll-item">

${skin[0]}

<span>
${skin[1]}
</span>

</div>

`;

}

setTimeout(()=>{

const winner =
skins[
Math.floor(
Math.random()*skins.length
)
];

document
.getElementById("result")
.innerHTML=
"🎉 Získal jsi: "+
winner[1];

inventory.unshift({
icon:winner[0],
name:winner[1]
});

localStorage.setItem(
"inventory",
JSON.stringify(inventory)
);

renderInventory();

},2200);

}

function closeModal(){

document
.getElementById("modal")
.classList.remove("show");

}

update();

</script>

</body>
</html>
